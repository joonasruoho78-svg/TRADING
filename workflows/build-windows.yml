name: Build Windows app

# This is the practical way to get a real TradeSignals.exe without owning a
# Windows machine: Flutter's Windows desktop target has to be *compiled* on
# Windows (it needs MSVC, which doesn't run on Linux/macOS), but GitHub gives
# every repo free Windows runners that already have Visual Studio's Build
# Tools installed. Push this file to a repo (any repo -- it doesn't need to
# be the bot's repo) with this Flutter project at its root, and GitHub does
# the actual Windows build for you.
#
# Two ways to run it:
#   1. Automatically on every push to main that touches this app.
#   2. On demand: the repo's Actions tab -> "Build Windows app" -> "Run workflow".
# Either way, open the finished run and download the "TradeSignals-windows"
# artifact from the "Artifacts" section at the bottom of the run summary --
# it's a zip containing TradeSignals.exe plus the .dll files it needs
# alongside it (Flutter's Windows build is not a single standalone .exe --
# keep the whole extracted folder together).

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "windows/**"
      - "pubspec.yaml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter test

      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: TradeSignals-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
